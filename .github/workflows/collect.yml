name: Collect data

# A self-renewing collector: each run loops every 5 minutes for ~5h45m, then starts its successor.
# GitHub's own cron is unreliable at 5-minute cadence, so it is kept only as a backup starter.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: collector
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure git
        working-directory: data
        run: |
          git config user.name "gta6-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Collect every 5 minutes
        env:
          LOOP_MINUTES: 345
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: ./collector/loop.sh
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main
