name: Collect data

# Records Snapshots and refreshes history every 5 minutes (GitHub may delay scheduled runs under load).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: collector
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Snapshot sources without history
        run: node collector/snapshot.mjs
      - name: Refresh sources with history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node collector/history.mjs
      - name: Build website bundle
        run: node collector/bundle.mjs
      - name: Commit to the data branch
        working-directory: data
        run: |
          git config user.name "gta6-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin data && git push -q origin data && exit 0; sleep 5; done
          exit 1
